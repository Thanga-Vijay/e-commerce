# Automated Backup CronJob for Kubernetes

---
# CronJob for daily database backups
apiVersion: batch/v1
kind: CronJob
metadata:
  name: database-backup
  namespace: ecommerce
spec:
  schedule: "0 2 * * *"  # Daily at 2 AM
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: backup-job
        spec:
          serviceAccountName: backup-job
          restartPolicy: OnFailure
          containers:
          - name: backup
            image: postgres:15-alpine
            command:
            - /bin/sh
            - -c
            - |
              #!/bin/sh
              set -e
              
              BACKUP_DATE=$(date +%Y%m%d_%H%M%S)
              BACKUP_DIR="/backups/$BACKUP_DATE"
              mkdir -p "$BACKUP_DIR"
              
              # Backup each database
              for db in auth product cart wishlist order payment inventory notification reporting; do
                echo "Backing up ${db}_db..."
                PGPASSWORD=$POSTGRES_PASSWORD pg_dump \
                  -h ${db}-db-service \
                  -U postgres \
                  -d ${db}_db \
                  | gzip > "$BACKUP_DIR/${db}_db.sql.gz"
              done
              
              # Create checksum
              cd "$BACKUP_DIR"
              sha256sum *.sql.gz > checksums.txt
              
              # Upload to S3 (if configured)
              if [ ! -z "$AWS_S3_BUCKET" ]; then
                aws s3 cp "$BACKUP_DIR" "s3://$AWS_S3_BUCKET/backups/" --recursive
              fi
              
              echo "Backup completed: $BACKUP_DIR"
            env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_PASSWORD
            - name: AWS_S3_BUCKET
              value: "your-backup-bucket"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws-credentials
                  key: access-key-id
                  optional: true
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws-credentials
                  key: secret-access-key
                  optional: true
            volumeMounts:
            - name: backup-storage
              mountPath: /backups
            resources:
              requests:
                memory: "256Mi"
                cpu: "250m"
              limits:
                memory: "512Mi"
                cpu: "500m"
          volumes:
          - name: backup-storage
            persistentVolumeClaim:
              claimName: backup-storage

---
# PVC for backup storage
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backup-storage
  namespace: ecommerce
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi

---
# CronJob for cleanup old backups
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-cleanup
  namespace: ecommerce
spec:
  schedule: "0 3 * * 0"  # Weekly on Sunday at 3 AM
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: cleanup
            image: alpine:3.18
            command:
            - /bin/sh
            - -c
            - |
              # Delete backups older than 30 days
              find /backups -type d -mtime +30 -exec rm -rf {} +
              echo "Cleanup completed"
            volumeMounts:
            - name: backup-storage
              mountPath: /backups
          volumes:
          - name: backup-storage
            persistentVolumeClaim:
              claimName: backup-storage

---
# CronJob for Redis backup
apiVersion: batch/v1
kind: CronJob
metadata:
  name: redis-backup
  namespace: ecommerce
spec:
  schedule: "0 */6 * * *"  # Every 6 hours
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: redis-backup
            image: redis:7-alpine
            command:
            - /bin/sh
            - -c
            - |
              BACKUP_DATE=$(date +%Y%m%d_%H%M%S)
              redis-cli -h redis-service -a $REDIS_PASSWORD BGSAVE
              sleep 10
              cp /data/dump.rdb "/backups/redis_${BACKUP_DATE}.rdb"
              gzip "/backups/redis_${BACKUP_DATE}.rdb"
            env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: REDIS_PASSWORD
            volumeMounts:
            - name: backup-storage
              mountPath: /backups
          volumes:
          - name: backup-storage
            persistentVolumeClaim:
              claimName: backup-storage
