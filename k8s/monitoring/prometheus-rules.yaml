apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: ecommerce
data:
  alerts.yml: |
    groups:
    - name: ecommerce-alerts
      interval: 30s
      rules:
      # Pod availability alerts
      - alert: PodDown
        expr: up{job=~".*-service"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Pod {{ $labels.kubernetes_pod_name }} is down"
          description: "Pod {{ $labels.kubernetes_pod_name }} in namespace {{ $labels.kubernetes_namespace }} has been down for more than 5 minutes."
      
      # High CPU usage
      - alert: HighCPUUsage
        expr: rate(container_cpu_usage_seconds_total{namespace="ecommerce"}[5m]) > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage detected"
          description: "Container {{ $labels.container }} in pod {{ $labels.pod }} is using more than 80% CPU for 10 minutes."
      
      # High Memory usage
      - alert: HighMemoryUsage
        expr: container_memory_usage_bytes{namespace="ecommerce"} / container_spec_memory_limit_bytes{namespace="ecommerce"} > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage detected"
          description: "Container {{ $labels.container }} in pod {{ $labels.pod }} is using more than 90% of allocated memory."
      
      # Pod restart rate
      - alert: HighPodRestartRate
        expr: rate(kube_pod_container_status_restarts_total{namespace="ecommerce"}[15m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High pod restart rate"
          description: "Pod {{ $labels.pod }} is restarting frequently."
      
      # Database connection issues
      - alert: DatabaseConnectionPoolExhausted
        expr: pg_stat_activity_count{namespace="ecommerce"} / pg_settings_max_connections{namespace="ecommerce"} > 0.8
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Database connection pool near exhaustion"
          description: "Database {{ $labels.datname }} is using more than 80% of available connections."
      
      # API latency
      - alert: HighAPILatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{namespace="ecommerce"}[5m])) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High API latency detected"
          description: "Service {{ $labels.service }} has P95 latency > 2s for 10 minutes."
      
      # Error rate
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5..", namespace="ecommerce"}[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "Service {{ $labels.service }} has error rate > 5% for 5 minutes."
      
      # Kafka lag
      - alert: KafkaConsumerLag
        expr: kafka_consumer_lag{namespace="ecommerce"} > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Kafka consumer lag is high"
          description: "Consumer {{ $labels.consumer_group }} has lag > 1000 messages on topic {{ $labels.topic }}."
      
      # Redis connection issues
      - alert: RedisDown
        expr: redis_up{namespace="ecommerce"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Redis is down"
          description: "Redis instance {{ $labels.instance }} is down."
      
      # Disk space
      - alert: LowDiskSpace
        expr: (node_filesystem_avail_bytes{namespace="ecommerce"} / node_filesystem_size_bytes{namespace="ecommerce"}) < 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low disk space"
          description: "Node {{ $labels.node }} has less than 10% disk space available on {{ $labels.mountpoint }}."
