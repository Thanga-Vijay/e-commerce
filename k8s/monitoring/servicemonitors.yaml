# PodMonitor for PostgreSQL databases
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: postgresql-monitor
  namespace: ecommerce
spec:
  selector:
    matchLabels:
      app: postgres
  podMetricsEndpoints:
  - port: metrics
    interval: 30s
