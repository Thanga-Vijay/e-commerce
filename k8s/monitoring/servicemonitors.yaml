# ServiceMonitor resources for Prometheus Operator
# If using Prometheus Operator, these resources enable automatic service discovery

apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: auth-service-monitor
  namespace: ecommerce
  labels:
    app: auth-service
spec:
  selector:
    matchLabels:
      app: auth-service
  endpoints:
  - port: http
    path: /metrics
    interval: 30s
---
