apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: ecommerce
type: Opaque
stringData:
  # Database Passwords
  POSTGRES_PASSWORD: "changeme-postgres-password"
  
  # Redis Password
  REDIS_PASSWORD: "changeme-redis-password"
  
  # JWT Secret
  JWT_SECRET: "changeme-jwt-secret-key-min-32-chars"
  
  # Stripe Keys (use your actual keys)
  STRIPE_SECRET_KEY: "sk_live_changeme"
  STRIPE_WEBHOOK_SECRET: "whsec_changeme"
  
  # SMTP Configuration
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  SMTP_USER: "your-email@gmail.com"
  SMTP_PASSWORD: "changeme-smtp-password"
  SMTP_FROM: "noreply@ecommerce.com"
