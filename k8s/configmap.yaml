apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: ecommerce
data:
  # Database Configuration
  POSTGRES_USER: "postgres"
  DB_HOST_AUTH: "auth-db-service"
  DB_HOST_PRODUCT: "product-db-service"
  DB_HOST_CART: "cart-db-service"
  DB_HOST_WISHLIST: "wishlist-db-service"
  DB_HOST_ORDER: "order-db-service"
  DB_HOST_PAYMENT: "payment-db-service"
  DB_HOST_INVENTORY: "inventory-db-service"
  DB_HOST_NOTIFICATION: "notification-db-service"
  DB_HOST_REPORTING: "reporting-db-service"
  DB_PORT: "5432"
  DB_PASSWORD: changeme-postgres-password
  
  # Redis Configuration
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  
  # Kafka Configuration
  #KAFKA_BROKERS: "kafka-0.kafka-headless.ecommerce.svc.cluster.local:9092,kafka-1.kafka-headless.ecommerce.svc.cluster.local:9092,kafka-2.kafka-headless.ecommerce.svc.cluster.local:9092"
  KAFKA_BROKERS: "kafka-0.kafka-headless.ecommerce.svc.cluster.local:9092"  
  KAFKA_ENABLED: "true"
  
  # Service URLs
  AUTH_SERVICE_URL: "http://auth-service:8081"
  PRODUCT_SERVICE_URL: "http://product-service:8082"
  CART_SERVICE_URL: "http://cart-service:8083"
  WISHLIST_SERVICE_URL: "http://wishlist-service:8084"
  ORDER_SERVICE_URL: "http://order-service:8085"
  PAYMENT_SERVICE_URL: "http://payment-service:8086"
  INVENTORY_SERVICE_URL: "http://inventory-service:8087"
  NOTIFICATION_SERVICE_URL: "http://notification-service:8088"
  REPORTING_SERVICE_URL: "http://reporting-service:8089"
  
  # Application Configuration
  GIN_MODE: "release"
  LOG_LEVEL: "info"
  ENVIRONMENT: "local"
  
  # LocalStack / AWS Configuration
  AWS_ENDPOINT_URL: "http://localstack.localstack.svc.cluster.local:4566"
  AWS_REGION: "us-east-1"
  AWS_ACCESS_KEY_ID: "test"
  AWS_SECRET_ACCESS_KEY: "test"
  S3_BUCKET_IMAGES: "ecommerce-images"
  S3_BUCKET_BACKUPS: "ecommerce-backups"
  S3_BUCKET_LOGS: "ecommerce-logs"
  USE_LOCALSTACK: "true"
