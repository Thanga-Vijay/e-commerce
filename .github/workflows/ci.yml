name: CI - Build and Test

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

env:
  GO_VERSION: '1.22'
  NODE_VERSION: '18'

jobs:
  # Detect which services changed
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      auth: ${{ steps.changes.outputs.auth }}
      product: ${{ steps.changes.outputs.product }}
      cart: ${{ steps.changes.outputs.cart }}
      wishlist: ${{ steps.changes.outputs.wishlist }}
      order: ${{ steps.changes.outputs.order }}
      payment: ${{ steps.changes.outputs.payment }}
      inventory: ${{ steps.changes.outputs.inventory }}
      notification: ${{ steps.changes.outputs.notification }}
      reporting: ${{ steps.changes.outputs.reporting }}
      frontend: ${{ steps.changes.outputs.frontend }}
      k8s: ${{ steps.changes.outputs.k8s }}
      any_service: ${{ steps.changes.outputs.any_service }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for changed files
        uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            auth:
              - 'auth-service/**'
            product:
              - 'product-service/**'
            cart:
              - 'cart-service/**'
            wishlist:
              - 'wishlist-service/**'
            order:
              - 'order-service/**'
            payment:
              - 'payment-service/**'
            inventory:
              - 'inventory-service/**'
            notification:
              - 'notification-service/**'
            reporting:
              - 'reporting-service/**'
            frontend:
              - 'frontend/**'
            k8s:
              - 'k8s/**'
            workflows:
              - '.github/workflows/**'
            any_service:
              - 'auth-service/**'
              - 'product-service/**'
              - 'cart-service/**'
              - 'wishlist-service/**'
              - 'order-service/**'
              - 'payment-service/**'
              - 'inventory-service/**'
              - 'notification-service/**'
              - 'reporting-service/**'

  # Test Go Microservices (Matrix Strategy)
  test-services:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      (matrix.service == 'auth-service' && needs.detect-changes.outputs.auth == 'true') ||
      (matrix.service == 'product-service' && needs.detect-changes.outputs.product == 'true') ||
      (matrix.service == 'cart-service' && needs.detect-changes.outputs.cart == 'true') ||
      (matrix.service == 'wishlist-service' && needs.detect-changes.outputs.wishlist == 'true') ||
      (matrix.service == 'order-service' && needs.detect-changes.outputs.order == 'true') ||
      (matrix.service == 'payment-service' && needs.detect-changes.outputs.payment == 'true') ||
      (matrix.service == 'inventory-service' && needs.detect-changes.outputs.inventory == 'true') ||
      (matrix.service == 'notification-service' && needs.detect-changes.outputs.notification == 'true') ||
      (matrix.service == 'reporting-service' && needs.detect-changes.outputs.reporting == 'true')
    strategy:
      matrix:
        service:
          - auth-service
          - product-service
          - cart-service
          - wishlist-service
          - order-service
          - payment-service
          - inventory-service
          - notification-service
          - reporting-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: go mod download

      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: go test -v -race ./...

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service }}
          file: ${{ matrix.service }}/Dockerfile
          push: false
          tags: ecommerce/${{ matrix.service }}:${{ github.sha }}

  # Test Frontend
  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run linter
        working-directory: frontend
        run: npm run lint

      - name: Run tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          tags: ecommerce/frontend:${{ github.sha }}

  # Validate Kubernetes Manifests
  validate-kubernetes:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.k8s == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Validate manifests
        run: |
          find k8s -name '*.yaml' -type f | while read file; do
            echo "Validating $file"
            kubectl apply --dry-run=client -f "$file" || exit 1
          done

      - name: Run kubeval
        run: |
          wget https://github.com/instrumenta/kubeval/releases/latest/download/kubeval-linux-amd64.tar.gz
          tar xf kubeval-linux-amd64.tar.gz
          find k8s -name '*.yaml' -type f | while read file; do
            echo "Running kubeval on $file"
            ./kubeval "$file" || exit 1
          done

  # Summary job - always runs to check overall status
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [detect-changes, test-services, test-frontend, validate-kubernetes]
    if: always()
    steps:
      - name: Check CI status
        run: |
          if [[ "${{ needs.test-services.result }}" == "failure" ]] || \
             [[ "${{ needs.test-frontend.result }}" == "failure" ]] || \
             [[ "${{ needs.validate-kubernetes.result }}" == "failure" ]]; then
            echo "CI failed"
            exit 1
          fi
          echo "CI passed successfully!"
