name: CD - Deploy to Kubernetes

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/ecommerce

jobs:
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [auth, product, cart, wishlist, order, payment, inventory, notification, reporting, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}-service
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service == 'frontend' && 'frontend' || format('services/{0}', matrix.service) }}
          file: ${{ matrix.service == 'frontend' && 'frontend/Dockerfile' || format('services/{0}/Dockerfile', matrix.service) }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: staging
      url: https://staging.ecommerce.yourdomain.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBECONFIG_STAGING }}" > kubeconfig
          export KUBECONFIG=kubeconfig

      - name: Deploy to staging
        run: |
          # Update image tags in manifests
          export IMAGE_TAG=${{ github.sha }}
          cd k8s
          
          # Apply all manifests
          kubectl apply -f namespace.yaml
          kubectl apply -f configmap.yaml
          kubectl apply -f secrets.yaml
          kubectl apply -f databases/
          kubectl apply -f redis/
          kubectl apply -f kafka/
          
          # Update service images with new tag
          for service in auth product cart wishlist order payment inventory notification reporting; do
            kubectl set image deployment/${service}-service \
              ${service}-service=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${service}-service:${{ github.sha }} \
              -n ecommerce
          done
          
          kubectl set image deployment/frontend \
            frontend=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend-service:${{ github.sha }} \
            -n ecommerce
          
          kubectl apply -f services/
          kubectl apply -f frontend/
          kubectl apply -f ingress/
          kubectl apply -f hpa/

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/auth-service -n ecommerce --timeout=5m
          kubectl rollout status deployment/product-service -n ecommerce --timeout=5m
          kubectl rollout status deployment/frontend -n ecommerce --timeout=5m

      - name: Run smoke tests
        run: |
          echo "Running smoke tests..."
          # Add smoke test commands here

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
      url: https://ecommerce.yourdomain.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBECONFIG_PRODUCTION }}" > kubeconfig
          export KUBECONFIG=kubeconfig

      - name: Deploy to production
        run: |
          export IMAGE_TAG=${{ github.ref_name }}
          cd k8s
          
          # Apply manifests with production configs
          kubectl apply -f namespace.yaml
          kubectl apply -f configmap.yaml
          kubectl apply -f secrets.yaml
          
          # Database deployments (if needed)
          kubectl apply -f databases/
          kubectl apply -f redis/
          kubectl apply -f kafka/
          
          # Update service images
          for service in auth product cart wishlist order payment inventory notification reporting; do
            kubectl set image deployment/${service}-service \
              ${service}-service=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${service}-service:${{ github.ref_name }} \
              -n ecommerce
          done
          
          kubectl set image deployment/frontend \
            frontend=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend-service:${{ github.ref_name }} \
            -n ecommerce
          
          kubectl apply -f services/
          kubectl apply -f frontend/
          kubectl apply -f ingress/
          kubectl apply -f hpa/

      - name: Wait for rollout
        run: |
          for deployment in auth-service product-service cart-service order-service payment-service frontend; do
            kubectl rollout status deployment/${deployment} -n ecommerce --timeout=10m
          done

      - name: Run health checks
        run: |
          echo "Running production health checks..."
          # Add health check commands

      - name: Notify deployment
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Production deployment ${{ github.ref_name }} completed!'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        if: always()

  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: deploy-production
    if: failure()
    steps:
      - name: Rollback deployment
        run: |
          echo "Rolling back production deployment..."
          kubectl rollout undo deployment/auth-service -n ecommerce
          kubectl rollout undo deployment/product-service -n ecommerce
          kubectl rollout undo deployment/frontend -n ecommerce
