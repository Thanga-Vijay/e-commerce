# KIND Cluster Configuration for E-Commerce Platform
# This configuration creates a multi-node Kubernetes cluster for local testing

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ecommerce-local

# Networking configuration
networking:
  # WARNING: It is _strongly_ recommended that you keep this the default
  # (127.0.0.1) for security reasons. However, if you want to expose your
  # services to other devices on your network, you can change this to 0.0.0.0
  apiServerAddress: "127.0.0.1"
  apiServerPort: 6443
  
  # Pod and Service CIDR ranges
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/16"
  
  # Disable default CNI (we'll use Calico or default)
  disableDefaultCNI: false
  
  # Configure kube-proxy
  kubeProxyMode: "iptables"

# Node configuration
nodes:
  # Control plane node
  - role: control-plane
    image: kindest/node:v1.28.0
    kubeadmConfigPatches:
    - |
      kind: InitConfiguration
      nodeRegistration:
        kubeletExtraArgs:
          node-labels: "ingress-ready=true"
    extraPortMappings:
    # HTTP Ingress
    - containerPort: 80
      hostPort: 80
      protocol: TCP
    # HTTPS Ingress
    - containerPort: 443
      hostPort: 443
      protocol: TCP
    # Frontend
    - containerPort: 30000
      hostPort: 3000
      protocol: TCP
    # Grafana
    - containerPort: 30001
      hostPort: 3001
      protocol: TCP
    # Prometheus
    - containerPort: 30002
      hostPort: 9090
      protocol: TCP
    # Jaeger UI
    - containerPort: 30003
      hostPort: 16686
      protocol: TCP
    # Kafka UI
    - containerPort: 30004
      hostPort: 8090
      protocol: TCP
    extraMounts:
    # Mount local storage for development
    - hostPath: ./data
      containerPath: /data
    # Mount Docker socket for building images
    - hostPath: /var/run/docker.sock
      containerPath: /var/run/docker.sock

  # Worker node 1
  - role: worker
    image: kindest/node:v1.28.0
    labels:
      tier: application
      node-type: compute
    extraMounts:
    - hostPath: ./data
      containerPath: /data

  # Worker node 2
  - role: worker
    image: kindest/node:v1.28.0
    labels:
      tier: application
      node-type: compute
    extraMounts:
    - hostPath: ./data
      containerPath: /data

  # Worker node 3 (for stateful workloads)
  - role: worker
    image: kindest/node:v1.28.0
    labels:
      tier: database
      node-type: storage
    extraMounts:
    - hostPath: ./data
      containerPath: /data

# Feature gates (enable alpha features if needed)
featureGates:
  # Enable CSI features
  CSIStorageCapacity: true
  # Enable topology aware hints
  TopologyAwareHints: true

# Runtime configuration
runtimeConfig:
  # Enable all APIs
  api/all: "true"

# Container runtime config
containerdConfigPatches:
- |-
  [plugins."io.containerd.grpc.v1.cri".registry.mirrors."localhost:5000"]
    endpoint = ["http://kind-registry:5000"]
