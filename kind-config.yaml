kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ecommerce-local

networking:
  apiServerAddress: "127.0.0.1"
  apiServerPort: 6443

nodes:
- role: control-plane
  image: kindest/node:v1.30.8

  kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "ingress-ready=true"

  extraPortMappings:
  - containerPort: 80
    hostPort: 80
    protocol: TCP

  - containerPort: 443
    hostPort: 443
    protocol: TCP

  - containerPort: 30000
    hostPort: 3000
    protocol: TCP

  - containerPort: 30001
    hostPort: 3001
    protocol: TCP

  - containerPort: 30002
    hostPort: 9090
    protocol: TCP

  - containerPort: 30003
    hostPort: 16686
    protocol: TCP

  - containerPort: 30004
    hostPort: 8090
    protocol: TCP

- role: worker
  image: kindest/node:v1.30.8

- role: worker
  image: kindest/node:v1.30.8

- role: worker
  image: kindest/node:v1.30.8