      options:
        max-size: "10m"
        max-file: "3"

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_AUTH_SERVICE_URL=http://localhost:8081
        - VITE_PRODUCT_SERVICE_URL=http://localhost:8082
        - VITE_CART_SERVICE_URL=http://localhost:8083
        - VITE_WISHLIST_SERVICE_URL=http://localhost:8084
        - VITE_ORDER_SERVICE_URL=http://localhost:8085
        - VITE_PAYMENT_SERVICE_URL=http://localhost:8086
        - VITE_INVENTORY_SERVICE_URL=http://localhost:8087
        - VITE_NOTIFICATION_SERVICE_URL=http://localhost:8088
        - VITE_REPORTING_SERVICE_URL=http://localhost:8089
    image: ecommerce/frontend:latest
    container_name: frontend-prod
    networks:
      - frontend-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  auth-db-data:
  product-db-data:
  cart-db-data:
  wishlist-db-data:
  order-db-data:
  payment-db-data:
  inventory-db-data:
  notification-db-data:
  reporting-db-data:
  redis-data:

networks:
  backend-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
  frontend-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
