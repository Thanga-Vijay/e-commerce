      options:
        max-size: "10m"
        max-file: "3"

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    image: ecommerce/order-service:latest
    container_name: order-service-prod
    environment:
      - ENVIRONMENT=production
      - PORT=8085
      - DB_HOST=order-db
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_NAME=order_db
      - DB_SSLMODE=disable
      - CART_SERVICE_URL=http://cart-service:8083
      - PRODUCT_SERVICE_URL=http://product-service:8082
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      order-db:
        condition: service_healthy
      cart-service:
        condition: service_healthy
    networks:
      - backend-network
      - frontend-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8085/health"]
